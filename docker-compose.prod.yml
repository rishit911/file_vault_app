services:
  db:
    image: postgres:15-alpine
    container_name: fv-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    # No exposed ports for production (internal only)

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: filevault-backend:latest
    container_name: fv-backend-prod
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      BASE_URL: ${BASE_URL}
      FILE_BASE_PATH: /data/files
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - file_storage:/data/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: filevault-frontend:latest
    container_name: fv-frontend-prod
    environment:
      VITE_API_BASE: ${VITE_API_BASE}
      VITE_GQL_ENDPOINT: ${VITE_GQL_ENDPOINT}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Reverse proxy for production
  nginx:
    image: nginx:1.25-alpine
    container_name: fv-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  db_data:
    name: filevault_db_data_prod
  file_storage:
    name: filevault_file_storage_prod