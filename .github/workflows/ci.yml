name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.21
  NODE_VERSION: 20

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Verify Go environment
        run: |
          go env
          go version
          go mod tidy
          go mod download

      - name: Run vet & formatting checks
        run: |
          go vet ./...
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "❌ gofmt issues:"
            echo "$fmt_out"
            exit 1
          fi
          echo "✅ gofmt clean"

      - name: Build backend
        run: go build ./...

      - name: Run Go tests
        run: go test ./... -v

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run lint (if script exists)
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "ℹ️ No lint script, skipping"
          fi

      - name: Build frontend
        run: npm run build

      - name: Run tests (if script exists)
        run: |
          if npm run | grep -q "test"; then
            npm test
          else
            echo "ℹ️ No test script, skipping"
          fi
        continue-on-error: true

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check documentation
        run: |
          if [ ! -f "docs/documentation.md" ]; then
            echo "❌ Error: docs/documentation.md not found"
            exit 1
          fi
          echo "✅ Documentation exists"