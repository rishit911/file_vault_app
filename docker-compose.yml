version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: fv-postgres
    env_file:
      - ./.env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: filevault-backend:latest
    container_name: fv-backend
    env_file:
      - ./.env.docker
      - ./backend/.env.dev
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      BASE_URL: ${BASE_URL}
      FILE_BASE_PATH: ${FILE_BASE_PATH}
      PORT: "${BACKEND_PORT}"
    volumes:
      - ./data/files:/data/files
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:${BACKEND_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: filevault-frontend:latest
    container_name: fv-frontend
    env_file:
      - ./.env.docker
    environment:
      VITE_API_BASE: ${VITE_API_BASE}
      VITE_GQL_ENDPOINT: ${VITE_GQL_ENDPOINT}
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:${FRONTEND_PORT} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  db_data:
    name: filevault_db_data

### END compose file
# Notes:
# - We mount `./backend/migrations` as `/docker-entrypoint-initdb.d` so Postgres runs SQL files on first init.
# - The backend uses `DATABASE_URL` pointing to service `db`.
# - Frontend uses provided `nginx.conf` to serve built assets (your Dockerfile already copies built dist).